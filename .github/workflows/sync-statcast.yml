name: Sync Statcast data & roster

# Keeps the two things that go stale automatically:
#   1. backend/data/pitchmodel.duckdb — new pitches since the last run,
#      pulled via --since-last so no one has to hand-pick a date range.
#   2. src/data/players.ts — regenerated from the refreshed data, so new
#      call-ups (rookies, trades) show up in the frontend's player
#      pickers without a manual PR.
#
# The pipeline: download the currently-published database -> pull new
# Statcast rows since its latest game_date -> regenerate the roster ->
# publish the updated database back to the "db-latest" release (the
# same asset backend/storage/duckdb_adapter.ensure_db_present() downloads
# on a cold start, e.g. on Render) -> commit players.ts if it changed.
#
# One-time setup this workflow depends on (repo settings, not code):
#   - Settings -> Actions -> General -> Workflow permissions -> "Read and
#     write permissions", so the default GITHUB_TOKEN can push commits
#     and create/update releases.
#   - A "db-latest" release must already exist with a pitchmodel.duckdb
#     asset representing a *contiguous* backfill — --since-last only
#     looks at the max game_date, it can't detect a hole earlier in the
#     history. See backend/README.md for the one-time bootstrap.

on:
  schedule:
    - cron: "0 13 * * 1" # every Monday, 13:00 UTC (~9am ET)
  workflow_dispatch:
    inputs:
      end_date:
        description: "End date to sync through (YYYY-MM-DD). Defaults to yesterday."
        required: false

permissions:
  contents: write

concurrency:
  group: sync-statcast
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run backend test suite (gate before touching the published database)
        run: python -m pytest backend/tests -v

      - name: Download the currently-published database
        run: python -c "import sys; sys.path.insert(0, 'backend'); from storage.duckdb_adapter import ensure_db_present; ensure_db_present()"

      - name: Determine end date
        id: dates
        run: |
          END="${{ github.event.inputs.end_date }}"
          if [ -z "$END" ]; then END=$(date -u -d 'yesterday' +%F); fi
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Pull new pitches since the last load
        run: |
          python backend/etl/fetch_statcast.py \
            --since-last \
            --end "${{ steps.dates.outputs.end }}" \
            --chunk-days 3 \
            --load-duckdb

      - name: Regenerate the frontend roster
        run: python backend/etl/build_roster.py

      - name: Publish the updated database as the db-latest release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload db-latest backend/data/pitchmodel.duckdb --clobber \
            || gh release create db-latest backend/data/pitchmodel.duckdb \
                 --title "Latest Statcast database" \
                 --notes "Auto-published by sync-statcast.yml on $(date -u +%F)."

      - name: Commit the regenerated roster if it changed
        run: |
          if ! git diff --quiet -- src/data/players.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/players.ts
            git commit -m "chore: sync roster from Statcast data ($(date -u +%F))"
            git push
          else
            echo "players.ts unchanged — nothing to commit"
          fi
